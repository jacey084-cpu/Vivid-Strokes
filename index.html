<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Strokes | Midnight Studio</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="watercolor-canvas"></canvas>

    <div class="main-content">
        <h1 class="reveal-text">Vivid Strokes</h1>
        <br>
        <p class="reveal-text sub-header">An artist website where I can sell art and make your artistic dreams come to life.</p>
        <br><br>
        <p><a href="vision.html" class="reveal-text paint-link">Explore My Vision!</a></p>
        <p><a href="artistinfo.html" class="reveal-text paint-link">Learn about the artist here!</a></p>
        <p><a href="portfolio.html" class="reveal-text paint-link">My Portfolio!</a></p>
        <p><a href="checkout.html" class="reveal-text paint-link">View Studio Bag 🛒</a></p>
    </div>

    <!-- Floating Bubble Dock -->
    <div class="floating-dock">
        <div class="bubble-row">
            <div id="commission-guide" class="guide-label">
                <span>Start a Commission</span>
                <span class="close-guide">&times;</span>
            </div>
            <button id="commission-launcher" class="bubble-launcher" aria-label="Start a Commission">
                <span>✨</span>
            </button>
        </div>

        <div class="bubble-row">
            <div id="inquiry-guide" class="guide-label">
                <span>Artist Inquiry (Email Me)</span>
                <span class="close-guide">&times;</span>
            </div>
            <button id="inquiry-launcher" class="bubble-launcher" aria-label="Artist Inquiry">
                <span>💬</span>
            </button>
        </div>
    </div>

    <!-- Artist Inquiry Popup -->
    <div id="inquiry-window" class="glass-card popup-window">
        <div id="inquiry-content">
            <div class="popup-header">
                <h4>Artist Inquiry</h4>
                <span class="close-btn" id="close-inquiry">&times;</span>
            </div>
            <form action="https://formspree.io" method="POST" id="inquiry-form">
                <input type="text" name="name" placeholder="Your Name" class="glass-input" required>
                <input type="email" name="email" placeholder="Your Email" class="glass-input" required>
                <textarea name="message" placeholder="Ask a question..." class="glass-input" rows="4" required></textarea>
                <button type="submit" id="crow-btn" class="paint-link full-btn">Send Crow</button>
            </form>
        </div>
    </div>

    <!-- Art Commission Popup -->
    <div id="commission-window" class="glass-card popup-window">
        <div id="commission-content">
            <div class="popup-header">
                <h4>Art Commission</h4>
                <span class="close-btn" id="close-commission">&times;</span>
            </div>
            <label class="input-label">MEDIUM & PRICE</label>
            <select id="com-type" class="glass-input">
                <option value="Digital Art" data-price="5">Digital Art — $5</option>
                <option value="Traditional Pieces" data-price="10">Traditional Pieces — $10</option>
                <option value="Animations" data-price="15">Animations — $15</option>
                <option value="Paintings" data-price="20">Paintings — $20</option>
                <option value="Clay Structures" data-price="30">Clay Structures — $30</option>
            </select>
            <label class="input-label">VISION</label>
            <textarea id="com-desc" placeholder="Describe your heart's desire..." class="glass-input" rows="4" style="resize: none;"></textarea>
            <button type="button" id="add-to-bag-btn" class="paint-link full-btn">Send to Bag</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
